spring.application.name=smarthealth-assistant

# ===== DATABASE (H2 in-memory - zero setup, resets on restart) =====
# For production, comment this block out and use the PostgreSQL block below instead.
spring.datasource.url=jdbc:h2:mem:smarthealth;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== POSTGRESQL (uncomment + fill in to use a real DB) =====
# spring.datasource.url=jdbc:postgresql://localhost:5432/smarthealth
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# CHANGE THIS SECRET before deploying anywhere real. Must be at least 256 bits (32+ chars).
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS_LONG
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# ===== AI (Groq — free, no credit card required) =====
# Get a free key at https://console.groq.com/keys (starts with gsk_)
# This uses Groq's OpenAI-compatible endpoint, so no code changes are needed.
openai.api.key=REPLACE_WITH_YOUR_GROQ_API_KEY
openai.api.url=https://api.groq.com/openai/v1/chat/completions
openai.model=llama-3.1-8b-instant

# ===== Alternative: OpenAI (paid) =====
# If you'd rather use OpenAI instead, get a key at https://platform.openai.com/api-keys
# and swap in these 3 lines instead:
# openai.api.key=sk-your-key-here
# openai.api.url=https://api.openai.com/v1/chat/completions
# openai.model=gpt-4o-mini

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
