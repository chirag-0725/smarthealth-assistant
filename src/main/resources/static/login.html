<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SmartHealth Assistant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="mark">SmartHealth Assistant</div>
      <div>
        <h1>Know your body a little better.</h1>
        <p>Log how you feel each day, and let a second pair of eyes help you notice the patterns you'd otherwise miss.</p>
        <svg class="auth-motif" width="180" height="60" viewBox="0 0 180 60" fill="none" style="margin-top:32px">
          <path d="M0 30 H50 L62 8 L76 52 L90 30 H180" stroke="#6E9A8C" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div style="font-size:13px;color:#9FB3A6;">A calmer way to track your health.</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form">
        <h2>Welcome back</h2>
        <div class="sub">Log in to see your health log and AI check-ins.</div>

        <div id="formNote"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
          <button class="btn-primary" type="submit" id="submitBtn">Log in</button>
        </form>

        <div class="auth-switch">
          New here? <a href="register.html">Create an account</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
